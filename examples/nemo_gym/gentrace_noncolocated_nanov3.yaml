defaults: async_non_colocated_nanov3.yaml

# Debug overlay to profile generation concurrency during validation (non-colocated
# dedicated inference pool). Same full 1000-prompt validate-at-start workload as
# gentrace_colocated_nanov3.yaml so the two are directly comparable. Kill once the
# [NRL-GEN-TRACE] concurrency lines stabilize. Run with NRL_GEN_TRACE=1.

grpo:
  val_at_start: true
  val_period: 1000000        # only validate at start (we kill before a 2nd)

logger:
  wandb:
    name: gentrace_noncolocated
