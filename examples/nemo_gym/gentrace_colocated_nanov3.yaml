defaults: async_colocated_singlemodel_nanov3.yaml

# Debug overlay to profile generation concurrency during validation (colocated
# single dual-mode model). Validates the full 1000-prompt set once at start
# (NeMo-Gym forbids max_val_samples), then kill the job as soon as the
# [NRL-GEN-TRACE] concurrency lines stabilize (the active-request count plateaus
# within the first minute). Run with NRL_GEN_TRACE=1. max_new_tokens is inherited
# at the production value so the KV/concurrency ceiling matches the real run.

grpo:
  val_at_start: true
  val_period: 1000000        # only validate at start (we kill before a 2nd)

logger:
  wandb:
    name: gentrace_colocated
