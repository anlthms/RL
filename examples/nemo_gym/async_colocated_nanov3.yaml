defaults: actually_run_nanov3.yaml

# Colocated async GRPO: training and inference share all 8 nodes x 4 GPUs.
# Scaled down from base (64 prompts / 1024 gbs) to fit 8 GB200 nodes on OCI-HSG.
# num_prompts_per_step * num_generations_per_prompt (16) = train_global_batch_size.

grpo:
  num_prompts_per_step: 16

policy:
  train_global_batch_size: 256

  megatron_cfg:
    # Colocated generation reuses the training model (transformer_engine impl,
    # not inference_optimized) and toggles cuda_graph_impl=local on it at
    # generation time. With EP > 1, Megatron-LM's TextGenerationController
    # requires expert padding in that combination (inference-only flag).
    moe_pad_experts_for_cuda_graph_inference: true
    # First training step OOMed in backward on 184GB GB200 (~150GB allocated;
    # 49k-token packed microbatches with no recompute). Applied to both
    # colocated and non-colocated configs to keep the comparison fair.
    activation_checkpointing: true
    # The 48GB-persist attempt failed on fragmentation, not capacity: a
    # 21.75GB contiguous logprob-forward ask vs 16GB free + 16GB reserved-
    # but-unallocated. expandable_segments reclaims that. Its documented cost
    # (slower weight transfer) does not apply: colocated mode never refits.
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  generation:
    mcore_generation_config:
      # persist @80GB left only ~22GB for the training phase (OOM); persist
      # @48GB failed only on allocator fragmentation (fixed via
      # expandable_segments above); "offload" mode hung NCCL collectives in
      # the first post-pause forward (torch_memory_saver unmap vs inference
      # CUDA graphs). 48GB persist + expandable_segments is the workable
      # point: ~32GB usable for the 21.75GB training-phase ask.
      buffer_size_gb: 48

    colocated:
      enabled: true
      resources:
        gpus_per_node: 4
        num_nodes: null

env:
  nemo_gym:
    skip_venv_if_present: true

logger:
  wandb:
    name: async_colocated
