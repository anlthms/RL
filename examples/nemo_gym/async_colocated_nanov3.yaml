defaults: actually_run_nanov3.yaml

# Colocated async GRPO: one dual-mode inference_optimized model (fast graphed decode
# + trainable TE fallback). Graphed decode requires kv persist, NOT offload (see below).

policy:

  generation:
    colocated:
      enabled: true
      resources:
        gpus_per_node: 4
        num_nodes: null
    mcore_generation_config:
      # persist, NOT offload: decode graphs capture KV-buffer pointers; offload relocates
      # the buffer -> illegal-access/NCCL deadlock (colo_cudagraph_desync_rootcause.md).
      kv_cache_management_mode: "persist"
      # Resident during training, so keep small; 40GB fits seq 16384 (raise seq -> lower this).
      buffer_size_gb: 40

  megatron_cfg:
    transformer_impl: "inference_optimized"
    allow_inference_optimized_training: true
    # Inference kernels (mirror the dedicated non-colocated model).
    inference_moe_token_dispatcher_type: "nccl"
    inference_grouped_gemm_backend: "vllm"
    # InferenceTopKRouter needs num_groups=None (nano-v3 n_group=1 is equivalent).
    moe_router_num_groups: null
    moe_router_group_topk: null
    # Forbidden with inference_optimized (dropless nccl dispatcher).
    moe_pad_experts_for_cuda_graph_inference: false
    # Graph the decode block (fast MoE decode); forbids recompute -> act_ckpt off.
    cuda_graph_impl: "local"
    inference_cuda_graph_scope: "block"
    activation_checkpointing: false
    distributed_data_parallel_config:
      # Synchronous DP collectives (overlap saves little; generation dominates).
      overlap_grad_reduce: false
      overlap_param_gather: false

env:
  nemo_gym:
    skip_venv_if_present: true

logger:
  wandb:
    name: async_colocated
