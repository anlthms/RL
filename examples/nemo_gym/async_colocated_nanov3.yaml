defaults: actually_run_nanov3.yaml

# Colocated async GRPO: training and inference share all 8 nodes x 4 GPUs.
# Scaled down from base (64 prompts / 1024 gbs) to fit 8 GB200 nodes on OCI-HSG.
# num_prompts_per_step * num_generations_per_prompt (16) = train_global_batch_size.

grpo:
  num_prompts_per_step: 16

policy:
  train_global_batch_size: 256

  # Reduced from 49152: the 49k-token packed microbatches were the memory
  # wall that blocked the colocated training phase. Applied to both configs
  # to keep the comparison fair; cascades to mb_tokens / max_new_tokens /
  # max_model_len via interpolation in grpo_nanov3.yaml.
  max_total_sequence_length: 32768

  megatron_cfg:
    # Colocated generation reuses the training model (transformer_engine impl,
    # not inference_optimized) and toggles cuda_graph_impl=local on it at
    # generation time. With EP > 1, Megatron-LM's TextGenerationController
    # requires expert padding in that combination (inference-only flag).
    moe_pad_experts_for_cuda_graph_inference: true
    # First training step OOMed in backward on 184GB GB200 (~150GB allocated;
    # 49k-token packed microbatches with no recompute). Applied to both
    # colocated and non-colocated configs to keep the comparison fair.
    activation_checkpointing: true

  generation:
    mcore_generation_config:
      # The buffer persists on GPU through the training pause, competing with
      # the logprob/train forward. 80GB OOMed the first logprob forward once
      # inference CUDA graphs + expert padding were enabled (graph pools +
      # padding workspaces consume the margin — RL.old issue #12); 64 frees
      # 16GB of headroom at ~20% less KV capacity. Inference CUDA graphs must
      # stay ON (graphs off is ~10x slower decode — unacceptable); if the
      # first-logprobs NCCL hang recurs, debug the graphs-on path (suspects
      # S2/S3 in async_colo_debug_guide.md) rather than disabling graphs.
      buffer_size_gb: 64

    colocated:
      enabled: true
      resources:
        gpus_per_node: 4
        num_nodes: null

env:
  nemo_gym:
    skip_venv_if_present: true

logger:
  wandb:
    name: async_colocated_32k_phaseA
