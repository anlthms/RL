# Math-only data/env override: drops NeMo-Gym for the built-in math env +
# OpenMathInstruct-2. `_override_: true` fully replaces the base gym data/env
# blocks. List AFTER the base config in a `defaults:` list.

data:
  _override_: true
  # Non-null required: math_hf_data_processor does `length >= max_seq_length`.
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: false
  train:
    dataset_name: OpenMathInstruct-2
    split_validation_size: 0.05  # carve validation from train
    seed: ${grpo.seed}
  validation: null  # validation comes from the train split above
  default:
    prompt_file: "examples/prompts/cot.txt"
    system_prompt_file: null
    processor: "math_hf_data_processor"
    env_name: "math"

env:
  _override_: true
  should_use_nemo_gym: false
  math:
    num_workers: 8
    math_verify_impl: "hf_math_verify"

logger:
  # Explicit (also inherited from grpo_nanov3.yaml): log per-GPU utilization to wandb.
  monitor_gpus: true
