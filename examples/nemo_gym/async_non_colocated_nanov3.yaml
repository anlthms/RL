defaults: actually_run_nanov3.yaml

# Non-colocated async GRPO: 4 training nodes + 4 inference nodes (4 GPUs each).
# Scaled down from base (64 prompts / 1024 gbs) to fit 8 GB200 nodes on OCI-HSG.
# num_prompts_per_step * num_generations_per_prompt (16) = train_global_batch_size.

grpo:
  num_prompts_per_step: 16

policy:
  train_global_batch_size: 256

  # Reduced from 49152: the 49k-token packed microbatches were the memory
  # wall that blocked the colocated training phase. Applied to both configs
  # to keep the comparison fair; cascades to mb_tokens / max_new_tokens /
  # max_model_len via interpolation in grpo_nanov3.yaml.
  max_total_sequence_length: 32768

  megatron_cfg:
    # First training step OOMed in backward on 184GB GB200 (~150GB allocated;
    # 49k-token packed microbatches with no recompute). Applied to both
    # colocated and non-colocated configs to keep the comparison fair.
    activation_checkpointing: true

  generation:
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 4

env:
  nemo_gym:
    skip_venv_if_present: true

logger:
  wandb:
    name: async_non_colocated_32k
