# Synthetic ARC-ladder data/env layer. Model-agnostic: list AFTER a
# <model>_<topology> config in a `defaults:` list.
#
# Parallel to env_arc.yaml, and everything not about the data source is
# deliberately identical to it -- the point of this layer is to change *what the
# model is asked to solve*, so that a difference in the result is attributable to
# the curriculum and not to a second simultaneous change.
#
# Why it exists: four runs on real ARC-AGI-2 produced grid_match == 0.0000 at
# every checkpoint. Every gradient the policy has ever received came from
# shaping. The ladder supplies tasks a 1.7B model can actually solve, so exact
# match has somewhere to move from.

grpo:
  # Validation on, in the same layer that configures what to validate against.
  # The model bases ship `val_period: 0` / `val_at_start: false`, so without
  # these a run silently trains to completion having never scored a single
  # validation row -- while this file carefully sets up two validation sources
  # and a batch size for them. Every prior ARC launch passed these through
  # EXTRA_OVERRIDES, which works right up until someone forgets.
  val_at_start: true
  val_period: 10

  # Validation is the synthetic held-out split followed by all 172 real
  # ARC-AGI-2 evaluation rows, in that order, so max_val_samples has to cover
  # both -- the loader does not shuffle and stops after
  # max_val_samples // val_batch_size batches. 344 = 172 + 172, and 43 divides
  # both exactly.
  max_val_samples: 344
  val_batch_size: 43

policy:
  # Synthetic prompts are smaller than real ARC ones (generated inputs are at
  # most 20x20 before the geometric rules, against 30x30 in the real corpus),
  # but the real evaluation split is still validated on, and its worst row is
  # 16593 tokens. Same context as env_arc.yaml.
  # NOTE: do not combine CMP=1 with this env -- it hard-sets 16384.
  max_total_sequence_length: 32768
  generation:
    max_new_tokens: 8192

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  # The size schedule below lives in the row order, so the loader must read
  # rows in order. Costless here: every generated task is already unique and
  # independently randomized, so shuffling bought nothing.
  shuffle: false
  num_workers: 1
  use_multiple_dataloader: false
  train:
    dataset_name: arc_synth
    # Levels are mixed within every batch rather than ramped across steps.
    # GRPO's advantage is computed within a group of rollouts on one prompt, so
    # a phase where every task is uniformly hopeless -- or uniformly trivial --
    # contributes no gradient. A ramp reintroduces exactly the degenerate-group
    # failure the curriculum is meant to fix. Repeat a level here to weight it.
    #
    # Level 0 is the identity, and it is the M4.1 *gate* rather than a rung:
    # mixing it in gives the policy a dominant degenerate strategy, because
    # echoing the input scores the full +1.4 there while the copy-relative
    # reward makes an echo worth ~0 -- not negative -- everywhere else. M4.2
    # (job 6072073) duly converged on it: 77-79% of level-1 and level-2 answers
    # were the test input copied verbatim by step 60, up from 19-24%, and
    # neither level ever solved a task. So level 0 is deliberately absent here.
    #
    # M4.1 overrides this to `[0]` to run the gate; M4.2b used `[1, 2]`.
    levels: [1, 2, 3, 4, 5]

    # Upper bound on a generated input grid's side. Grid size is a difficulty
    # axis independent of which transformation a level applies: exact match
    # needs every cell right, so at 99% per-cell accuracy a 300-cell grid
    # matches outright only ~5% of the time. M4.2 measured level 0 at 1.000 on
    # targets under 150 cells, 0.792 at 150-300, and 0.750 above 300. 20 is the
    # generator's own default and keeps grids comparable to real ARC.
    #
    # A *list* mixes sizes across the batch, which is what this runs: 6 is small
    # enough that a rotation is a handful of cells and exact match is genuinely
    # reachable, 20 keeps the run honest against real-ARC-sized grids. Mixed
    # rather than ramped small-to-large for the same reason levels are mixed --
    # a phase where every task shares a difficulty gives groups that are
    # uniformly hopeless or uniformly trivial, and those contribute no gradient.
    # Mixing also puts the reachable grids in *every* batch instead of only an
    # early phase, and needs no feedback path from the environment back to the
    # generator across Ray actors (which is the expensive part of an adaptive
    # ramp, and which §13 deferred on purpose).
    max_input_dim: [6, 12, 20]

    # Reweight that mixture across the run rather than holding it fixed: every
    # batch still contains all three sizes, but the mass shifts from small-heavy
    # to large-heavy, so mean difficulty rises step over step. Measured over a
    # 20-step schedule the per-window counts go [8, 5, 3] -> [3, 5, 8] and mean
    # size 10.5 -> 14.9, with no window ever dropping a size.
    #
    # This is the difference between reweighting a mixture and ramping: a ramp
    # puts every task in a batch at one difficulty, and a group of rollouts that
    # is uniformly hopeless or uniformly trivial has zero advantage and
    # contributes no gradient. Interpolated from grpo.num_prompts_per_step so
    # it tracks the model -- qwen3-1.7B takes 16 prompts a step, nano-v3
    # colocated takes 128, and a hardcoded window would run the schedule 8x too
    # fast on one of them. Needs `shuffle: false` above.
    #
    # Applied to size and not to level deliberately -- size is monotone in
    # difficulty, level number is not. M4.2 measured level 2 as *easier* than
    # level 1 (0.088 against 0.000), so ramping by level index would be ramping
    # by a guess.
    size_ramp_window: ${grpo.num_prompts_per_step}

    # How many steps the schedule spans. This has to be the *run* length, not
    # the dataset length: num_tasks is deliberately many times larger than any
    # run so no task repeats, and a ramp spread over 8000 rows leaves a 60-step
    # qwen run at 12% of its schedule -- an inert ramp that still reads as
    # configured. Rows past the end stay at the hardest mixture.
    size_ramp_steps: ${grpo.max_num_steps}
    # Materialized once at startup, so this trades startup seconds against
    # repetition. 60 steps x 16 prompts is 960 prompts; 8000 is far past any
    # run length we have used, so no task is ever seen twice.
    num_tasks: 8000
    num_val_tasks: 172
    seed: ${grpo.seed}
    # Must differ from `seed`, or the held-out split is the training tasks
    # verbatim and validation measures memorization. The dataset raises if they
    # match rather than silently reporting a train score.
    val_seed: 1000000
  validation:
    # The real ARC-AGI-2 evaluation split, alongside the synthetic held-out
    # rows. This is the measurement the whole phase exists for: whether solving
    # generated tasks transfers to real ones at all. A null result here is a
    # real answer. Reported separately as the `/real` bucket.
    #
    # split == validation_split so only the evaluation files are read; the
    # 1000-task training file is not needed here.
    - dataset_name: arc_agi
      data_path: /lustre/fs1/portfolios/nemotron/projects/nemotron_sw_pre/users/anthomas/ash/data/arc-prize-2025
      split: evaluation
      validation_split: evaluation
  default:
    prompt_file: "examples/prompts/arc_agi.txt"
    system_prompt_file: null
    processor: "arc_agi_data_processor"
    env_name: "arc_agi"

env:
  _override_: true
  should_use_nemo_gym: false
  arc_agi:
    # Unchanged from env_arc.yaml. The shaped terms still earn their keep here:
    # they break degenerate groups on the levels the policy cannot yet solve,
    # while exact match -- which on this data is finally nonzero -- dominates on
    # the ones it can.
    exact_weight: 1.0
    cell_weight: 0.20
    edit_weight: 0.10
    color_weight: 0.05
    extraneous_color_weight: 0.05
    shape_weight: 0.05
    format_weight: 0.05

checkpointing:
  # Off. Every number in this campaign comes from the val_data_step*.jsonl dumps
  # rather than from a checkpoint, and nano-v3's NeMo-Gym base turns this on with
  # save_period 4 and keep_top_k 1000000 -- fifteen checkpoints of an MoE model
  # over a 60-step run, in wall clock and lustre, for artifacts nothing reads.
  enabled: false
  # Corrected rather than left to the model base, and kept even though
  # checkpointing is off: nano-v3 inherits `val:total_reward/mean` from that gym
  # base, which the ARC environment never emits, and job 6124839 died at its
  # step-20 validation with "Metric total_reward/mean not found in val metrics"
  # after 2 hours. Which metrics exist is environment-owned knowledge, so it
  # belongs in the environment layer.
  metric_name: "val:accuracy"

logger:
  monitor_gpus: true
  num_val_samples_to_print: 4
