# Follow-up synthetic ARC experiment after joint_axes_pack16k_v2 learned the
# held-out generator (17 -> 51 / 172 exact) but stayed at 0 / 172 exact on real
# ARC-AGI-2. Keep the curriculum and reward fixed; change only the response
# failure mode measured in that run.
defaults:
  - env_arc_synth.yaml

policy:
  generation:
    # The prior run frequently exhausted 8192 tokens before emitting a grid;
    # its real responses averaged 17.8k characters at step 20. The paired
    # prompt requires a candidate within 1200 tokens, leaving ample room for a
    # maximum 30x30 answer and a brief correction inside this budget.
    max_new_tokens: 4096

data:
  default:
    prompt_file: "examples/prompts/arc_agi_early_answer.txt"
