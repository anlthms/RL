defaults: nanov3_base.yaml

policy:

  megatron_cfg:
    env_vars:
      # Only the non-colocated arm refits, so only it reaches MCore's NVSHMEM copy
      # service. That service now hard-errors unless NVSHMEM_MAX_CTAS is exactly
      # "2", and NVSHMEM's 128-team default is exhausted building the cross-world
      # refit group. qwen3_1p7b_base.yaml has carried these for the same reason.
      NVSHMEM_MAX_TEAMS: "512"
      NVSHMEM_MAX_CTAS: "2"

  generation:
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 4

env:
  nemo_gym:
    skip_venv_if_present: true

logger:
  wandb:
    name: async_non_colocated
