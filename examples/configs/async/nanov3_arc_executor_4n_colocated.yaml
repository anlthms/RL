# Four-node/16-GPU stage-4 executor GRPO. TP4 x EP4 keeps one model replica per
# node and preserves the one-node recipe's 32-sample per-GPU workload.
defaults:
  - nanov3_colocated.yaml
  - env_arc_executor.yaml

grpo:
  max_num_steps: 20
  num_prompts_per_step: 32

policy:
  train_global_batch_size: 512
  sequence_packing:
    train_mb_tokens: ${policy.max_total_sequence_length}
  make_sequence_length_divisible_by: 8
  megatron_cfg:
    tensor_model_parallel_size: 4

  generation:
    mcore_generation_config:
      tensor_model_parallel_size: 4
      buffer_size_gb: 24

cluster:
  num_nodes: 4
