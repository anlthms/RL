# NVARC executor+proposer co-training through NeMo-Gym. One policy plays two
# roles against the arc_agi_2 resources server: single-turn executor rows
# (apply a supplied NVARC rule to one grid, gain-over-echo reward) and
# eval-sequence proposer episodes (induce a canonical rule from demos, revise
# it from behavioral feedback on held-out grids, final proposer turn only in
# loss). The 90:10 -> 10:90 role schedule and the staged ventile curriculum
# are baked into the train JSONL row order by tools/nvarc_cotrain_materialize.py
# (data.shuffle: false; one num_prompts_per_step window per step).
#
# Validation is solely the real ARC-AGI-2 evaluation split (120 tasks / 172
# test-pair rows), measured two ways per row: single-turn induction via
# arc_agi_2_simple_agent (the cheap single-shot curve) and the full
# proposer-executor refinement loop via arc_transform_refinement_agent in
# hidden_test protocol (the deployment-shaped number: refine the rule on the
# demo pairs, then answer the hidden test grid). The verifier returns
# grid_match/cell_match as top-level scalars, which the gym rollout surfaces
# per agent as val:<agent>/<metric>/<stat>. Validation is greedy
# (val_temperature 0.0, one generation per prompt): low-noise curves are a
# precondition for the scaling-law fit.

grpo:
  val_at_start: true
  val_at_end: true
  val_period: 16
  val_num_generations_per_prompt: 1
  # The gym entrypoint requires null and scores the whole validation file in
  # one batch (val_batch_size is force-set to the file length: 172 induction
  # + 172 loop rows).
  max_val_samples: null
  val_batch_size: 344

policy:
  # 20480 engine ceiling for the ~16.3k-token real-ARC induction prompts;
  # training samples are far smaller, so the training microbatch is pinned
  # separately. Proposer trajectories are capped agent-side at 12288
  # (model_context_limit below) so the trainable final turn always fits the
  # train pack.
  max_total_sequence_length: 20480
  generation:
    max_new_tokens: 6144
    # Greedy validation on the megatron NeMo-Gym path: the sampling profile
    # is stamped per request and mcore's dynamic server maps temperature 0.0
    # to greedy decoding.
    val_temperature: 0.0
    mcore_generation_config:
      expose_http_server: true
    vllm_cfg:
      expose_http_server: true
  sequence_packing:
    train_mb_tokens: 12288
    logprob_mb_tokens: 12288
  megatron_cfg:
    scheduler:
      # Constant lr 3e-6 with no warmup: the run resumes across several
      # 4h-wall segments with save_optimizer false, and a per-segment
      # re-warm would ripple the scaling-law curve at every resume.
      lr_warmup_iters: 0

data:
  _override_: true
  max_input_seq_length: null  # the gym processor does not length-filter
  shuffle: false  # the curriculum and role schedule live in the row order
  num_workers: 1
  use_multiple_dataloader: false
  train:
    # v3: same 320-step schedule/seed as v2, but 56 pad windows (~8 per 4h
    # segment: EACH resume boundary discards up to a buffer-fill of
    # prefetched rows -- v2 starved at step 313/320 with only 12 total)
    # and the val loop rows stamped with the 19456 engine-window context.
    data_path: /lustre/fs1/portfolios/nemotron/projects/nemotron_sw_pre/users/anthomas/datasets/nvarc-cotrain/v3/train.jsonl
  validation:
    data_path: /lustre/fs1/portfolios/nemotron/projects/nemotron_sw_pre/users/anthomas/datasets/nvarc-cotrain/v3/val.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  _override_: true
  should_use_nemo_gym: true
  nemo_gym:
    skip_venv_if_present: true
    # Same port layout rationale as env_rl_blend.yaml: below the ephemeral
    # floor, clear of the generation range and the sandbox.
    port_range_low: 5000
    port_range_high: 5999
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml  # Required! And it must be *for_training
    - resources_servers/arc_agi_2/configs/arc_agi_2.yaml
    arc_transform_refinement_agent:
      responses_api_agents:
        arc_transform_refinement_agent:
          # Training proposer rows run the eval_sequence protocol; the
          # validation loop rows override to hidden_test per row.
          protocol: eval_sequence
          # Proposer chat budget: trainable trajectories (final prompt +
          # reserved output) must fit the 12288 train/logprob pack. The
          # plan's 6144 cap overflowed a pack bin by ~560 tokens (v2 crash
          # at step 30), so the proposer runs at the 5120 fallback with a
          # doubled template margin; the executor keeps the full 6144
          # engine budget (max executor training prompt is 3428 tokens,
          # so 3428 + 6144 always fits the pack).
          model_context_limit: 12288
          reserved_proposer_output_tokens: 5120
          chat_template_margin: 1024
          proposer_max_output_tokens: 5120
          # Match the native executor contract's output budget.
          executor_max_output_tokens: 6144
          # The context budget usually terminates episodes first; this is the
          # emergency cap.
          max_rounds: 8

checkpointing:
  enabled: true
  # Select checkpoints on the deployment-shaped loop-val metric: cell match
  # of the final hidden-test answers (exact match sits at ~0 for a long
  # time). The gym rollout surfaces per-agent scalars as
  # <agent>/<field>/<stat> (calculate_single_metric appends the stat
  # suffix), hence the /mean.
  metric_name: "val:arc_transform_refinement_agent/cell_match/mean"
  save_period: 16
  # The scaling law needs kept checkpoints at multiple data scales, not just
  # the best two.
  keep_top_k: 6

logger:
  monitor_gpus: true
  num_val_samples_to_print: 0  # gym message logs carry token ids, not text
