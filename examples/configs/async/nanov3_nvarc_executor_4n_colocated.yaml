# Four-node/16-GPU NVARC executor GRPO. TP4 topology; the sequence budget
# (20480 engine ceiling for real-ARC validation prompts, 12288 training
# microbatch, 6144 generated) lives in env_nvarc_executor.yaml.
defaults:
  - nanov3_colocated.yaml
  - env_nvarc_executor.yaml

grpo:
  # One full staged pass over the 19 difficulty ventiles at 6 steps per hold
  # (cumulative windows; see env_nvarc_executor.yaml).
  max_num_steps: 114
  num_prompts_per_step: 32

policy:
  train_global_batch_size: 512
  make_sequence_length_divisible_by: 8
  megatron_cfg:
    tensor_model_parallel_size: 4

  generation:
    mcore_generation_config:
      tensor_model_parallel_size: 4
      buffer_size_gb: 24

cluster:
  num_nodes: 4
