defaults: qwen3_1p7b_base.yaml

# Match the colocated arm's step: same prompts per step and same global batch, so
# the two topologies optimize on identical data and their curves overlay per step.
grpo:
  num_prompts_per_step: 128

policy:
  train_global_batch_size: 2048  # num_prompts_per_step * num_generations_per_prompt
  generation:
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 4

logger:
  wandb:
    name: async_non_colocated_qwen3_1p7b
