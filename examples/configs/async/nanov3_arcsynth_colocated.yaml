# Nano-v3 MoE, synthetic ARC-ladder env, colocated async GRPO (Megatron inference).
# Launch: MODEL=nanov3 ENV=arcsynth bash launch_experiment.sh colocated
#
# Nothing model-specific is set here: nanov3_colocated.yaml already sizes the KV
# buffer (80 GB) for this model, and env_arc_synth.yaml is model-agnostic --
# `size_ramp_window` interpolates grpo.num_prompts_per_step, which is 128 here
# against qwen3-1.7B's 16, so the size schedule tracks the model rather than
# needing a per-model constant.
#
# The base inherits from a NeMo-Gym config; env_arc_synth's `_override_: true`
# on the data and env blocks replaces that wholesale, and the run goes through
# examples/run_grpo.py with no gym server.
defaults:
  - nanov3_colocated.yaml
  - env_arc_synth.yaml
