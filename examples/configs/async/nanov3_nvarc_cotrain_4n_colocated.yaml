# Four-node/16-GPU NVARC executor+proposer co-training over NeMo-Gym. TP4
# topology; the sequence budget and the gym wiring live in
# env_nvarc_cotrain.yaml; the curriculum and role schedule live in the
# materialized JSONL (tools/nvarc_cotrain_materialize.py, whose --steps,
# --window, and --hold-steps must match this file).
defaults:
  - nanov3_colocated.yaml
  - env_nvarc_cotrain.yaml

grpo:
  # One full staged pass over the 19 difficulty ventiles at 3 steps per hold.
  max_num_steps: 57
  num_prompts_per_step: 32

policy:
  train_global_batch_size: 512
  make_sequence_length_divisible_by: 8
  megatron_cfg:
    tensor_model_parallel_size: 4

  generation:
    mcore_generation_config:
      tensor_model_parallel_size: 4
      buffer_size_gb: 24

cluster:
  num_nodes: 4
