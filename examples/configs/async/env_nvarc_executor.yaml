# Single-turn executor training on NVARC descriptions. The model receives a
# canonical 4-section NVARC rule plus one unseen input grid and is rewarded
# only for applying it. Data comes from the offline tools/nvarc_ingest.py
# parquet (train/executor_val pools split by puzzle id; every nvarc_full
# puzzle is seeded from an ARC-AGI-2 evaluation task and quarantined there).

grpo:
  val_at_start: true
  val_at_end: true
  val_period: 10
  max_val_samples: 150
  val_batch_size: 30

policy:
  max_total_sequence_length: 8192
  generation:
    max_new_tokens: 4096

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: false  # the difficulty ramp lives in the row order
  num_workers: 1
  use_multiple_dataloader: false
  train:
    dataset_name: nvarc_executor
    data_dir: /lustre/fs1/portfolios/nemotron/projects/nemotron_sw_pre/users/anthomas/datasets/nvarc-ingested/v1
    # Inclusive upper edges on max grid area; areas above the last edge form
    # the fifth bucket. Reported as level_1..level_5 validation metrics.
    # These are the ingested-v1 train-split quintiles (max-over-pairs area
    # saturates near 900 for half the corpus, so equal-mass edges beat round
    # numbers).
    bucket_edges: [380, 700, 783, 840]
    difficulty_ramp_window: ${grpo.num_prompts_per_step}
    difficulty_ramp_steps: ${grpo.max_num_steps}
    num_tasks: 4096
    num_val_tasks: 150
    seed: ${grpo.seed}
    val_seed: 1000000
  validation: null
  default:
    prompt_file: "examples/prompts/nvarc_executor.txt"
    system_prompt_file: null
    processor: "arc_executor_data_processor"
    env_name: "arc_agi"

env:
  _override_: true
  should_use_nemo_gym: false
  arc_agi:
    exact_weight: 1.0
    cell_weight: 0.20
    edit_weight: 0.10
    color_weight: 0.05
    extraneous_color_weight: 0.05
    shape_weight: 0.05
    format_weight: 0.05

checkpointing:
  enabled: true
  metric_name: "val:accuracy"
  save_period: 10
  keep_top_k: 2

logger:
  monitor_gpus: true
  num_val_samples_to_print: 4
