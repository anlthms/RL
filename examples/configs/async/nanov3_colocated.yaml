defaults: nanov3_base.yaml

# Colocated async GRPO with one dual-mode inference_optimized model: fast decode
# kernels under InferenceMode, trainable TE fallback for training. One model trains
# and generates -- no second model, no weight sync.
#
# Graphed decode (cuda_graph_impl=local + inference_cuda_graph_scope=block) makes MoE
# decode fast enough to overlap training, at non-colocated parity. It forbids full
# recompute, so activation_checkpointing is off and training memory is freed by
# offloading the KV cache during the pause (kv_cache_management_mode=offload).
# Multi-step stability also needs the DP overlaps off (see below) and a sync at the
# engine suspend/resume boundary (megatron_worker.py _sleep/_wake).

grpo:
  # 2x global batch for colocated: restores non-colo's per-GPU batch and decode efficiency.
  num_prompts_per_step: 128

policy:
  train_global_batch_size: 2048  # num_prompts_per_step * num_generations_per_prompt

  generation:
    colocated:
      enabled: true
      resources:
        gpus_per_node: 4
        num_nodes: null
    mcore_generation_config:
      # Offload the KV cache to CPU during the training pause so the training
      # forward fits without activation_checkpointing (which cuda_graph_impl=local
      # forbids). Uses mcore's torch_memory_saver (launcher SETUP_COMMAND).
      kv_cache_management_mode: "offload"
      # Must match megatron_cfg's TP below (one dual-mode model).
      tensor_model_parallel_size: 1

  megatron_cfg:
    # TP=1 (base is TP=2): matches the throughput reference run (5906745,
    # "tp1ep4"); TP=2 costs ~1.8x more GPU-time per token on this model.
    tensor_model_parallel_size: 1
    transformer_impl: "inference_optimized"
    # Inference kernels (mirror the dedicated non-colocated model).
    inference_moe_token_dispatcher_type: "nccl"
    inference_grouped_gemm_backend: "vllm"
    # InferenceTopKRouter requires num_groups=None (nano-v3 n_group=1 is equivalent).
    moe_router_num_groups: null
    moe_router_group_topk: null
    # Forbidden with inference_optimized (nccl dispatcher is dropless).
    moe_pad_experts_for_cuda_graph_inference: false
    # Graph the decode block (fast MoE decode); forbids full recompute, so
    # activation_checkpointing is off and KV is offloaded above instead.
    cuda_graph_impl: "local"
    inference_cuda_graph_scope: "block"
    activation_checkpointing: false
    distributed_data_parallel_config:
      # Colocated-only: the async replay buffer gives DP ranks unequal microbatch
      # counts, so overlapped grad-reduce/param-gather (async side-streams) desync
      # the DATA_PARALLEL grad-sync. Synchronous DP collectives stay in lockstep;
      # overlap saves little here since generation dominates.
      overlap_grad_reduce: false
      overlap_param_gather: false

env:
  nemo_gym:
    skip_venv_if_present: true

logger:
  wandb:
    name: async_colocated
